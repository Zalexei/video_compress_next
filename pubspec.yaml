name: video_compress_next
description: "Drop-in replacement for video_compress: hardware video compression with AndroidX Media3 Transformer and AVFoundation, no FFmpeg."
version: 0.1.1
repository: https://github.com/Zalexei/video_compress_next
issue_tracker: https://github.com/Zalexei/video_compress_next/issues
topics: [video, compression, media3, avfoundation, video-compress]
screenshots:
  - description: The example app after compressing a 1080p60 video to 720p30.
    path: doc/screenshot.png

environment:
  sdk: ^3.6.0
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  meta: ^1.15.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  pigeon: 26.0.1

flutter:
  plugin:
    platforms:
      android:
        package: io.github.zalexei.video_compress_next
        pluginClass: VideoCompressNextPlugin
      ios:
        pluginClass: VideoCompressNextPlugin
