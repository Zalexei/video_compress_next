group = "io.github.zalexei.video_compress_next"
version = "1.0-SNAPSHOT"

buildscript {
    ext.kotlin_version = "2.1.0"
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        classpath("com.android.tools.build:gradle:8.9.1")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version")
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: "com.android.library"

// Kotlin. With AGP 9+ and built-in Kotlin (android.builtInKotlin not set to
// false) AGP compiles Kotlin itself and a plugin must not apply the Kotlin
// Gradle Plugin (KGP). Everywhere else KGP is needed, and Flutter before 3.44
// does not add it to plugins, so the plugin applies it there. This mirrors
// isBuiltInKotlinEnabled in Flutter's Gradle plugin. KGP is applied with
// pluginManager and not with "apply plugin:" on purpose: Flutter 3.44+ scans
// this file for that line, warns about it, and otherwise applies KGP itself
// when built-in Kotlin is off, which is harmless next to this (applying a
// plugin twice does nothing).
def agpMajor = com.android.Version.ANDROID_GRADLE_PLUGIN_VERSION.tokenize(".")[0].toInteger()
def builtInKotlinProperty = providers.gradleProperty("android.builtInKotlin").getOrNull()
def builtInKotlin = agpMajor >= 9 && (builtInKotlinProperty == null || builtInKotlinProperty.toBoolean())
if (!builtInKotlin) {
    pluginManager.apply("kotlin-android")
}

// Media3 1.9.x is the newest line that builds with compileSdk 35; 1.10+ needs
// compileSdk 36. An app can pick another version in its android/gradle.properties:
//   videoCompressNextMedia3Version=1.11.1
def media3Version = rootProject.findProperty("videoCompressNextMedia3Version") ?: "1.9.4"
def media3Minor = media3Version.tokenize(".")[1].toInteger()

android {
    namespace = "io.github.zalexei.video_compress_next"

    compileSdk = media3Minor >= 10 ? 36 : 35

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 23
    }

    dependencies {
        implementation("androidx.media3:media3-transformer:$media3Version")
        implementation("androidx.media3:media3-effect:$media3Version")
        implementation("androidx.media3:media3-common:$media3Version")
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}

if (builtInKotlin) {
    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_11
        }
    }
} else {
    android {
        kotlinOptions {
            jvmTarget = JavaVersion.VERSION_11
        }
    }
}
