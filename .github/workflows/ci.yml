name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  dart:
    name: Dart tests (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest Flutter the package supports, and the latest stable.
        flutter: ['3.27.4', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        if: matrix.flutter == '3.x'
        run: dart format --output=none --set-exit-if-changed lib test
      # The example and the benchmark need newer Flutter, so only the package is analyzed.
      - run: flutter analyze lib test
      - run: flutter test

  android:
    name: Android build (Flutter ${{ matrix.flutter }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        flutter: ['3.27.4', '3.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ matrix.flutter }}
          channel: stable
          cache: true
      - name: Build a new app that uses the plugin
        shell: bash
        run: |
          set -eo pipefail
          flutter create --platforms=android --project-name=plugin_user "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          perl -0pi -e "s|\ndependencies:\n|\ndependencies:\n  video_compress_next:\n    path: $GITHUB_WORKSPACE\n|" pubspec.yaml
          sed -i 's/flutter.minSdkVersion/23/' android/app/build.gradle*
          flutter pub get
          grep -q '"video_compress_next"' .flutter-plugins-dependencies
          flutter build apk --debug

  ios:
    name: iOS build of the example
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter build ios --simulator --debug
        working-directory: example
